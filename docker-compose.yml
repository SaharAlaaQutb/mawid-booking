x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgres://${POSTGRES_USER:-mawid}:${POSTGRES_PASSWORD:-mawid}@db:5432/${POSTGRES_DB:-mawid}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  AUTH_REFRESH_COOKIE_SECURE: "false"
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "false"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Mawid <no-reply@mawid.local>}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mawid}
      POSTGRES_USER: ${POSTGRES_USER:-mawid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mawid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mawid} -d ${POSTGRES_DB:-mawid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    environment: *backend-environment
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: uv run celery -A config worker -l info
    environment: *backend-environment
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: uv run celery -A config beat -l info
    environment: *backend-environment
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
