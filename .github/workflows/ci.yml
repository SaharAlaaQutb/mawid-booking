name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mawid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mawid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mawid
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check translations
        run: uv run python manage.py check_translations
      - name: Compile translations
        run: uv run python manage.py compilemessages
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy apps config
      - name: Test
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=85
      - name: Check domain coverage gate
        run: coverage report --include='apps/*/domain/*' --fail-under=95
      - name: Check application coverage gate
        run: coverage report --include='apps/*/application/*' --fail-under=95
      - name: Check OpenAPI schema
        run: uv run python manage.py spectacular --format openapi-json --file openapi.json --validate && git diff --exit-code -- backend/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Check OpenAPI-generated types
        run: npm run schema:check
      - name: Test
        run: npm test
      - name: Check translations
        run: npm run i18n:check
      - name: Build
        run: npm run build
